<script>
'use strict';
// Только визуальная раскадровка. Игровой логики и сетевых запросов здесь нет.
const $=id=>document.getElementById(id);
const repeat=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join('');
const stages=[['START',0,[0,0,0,0,0]],['EARLY',.20,[.20,.214,.19,.207,.179]],['MID',.52,[.48,.548,.453,.51,.415]],['CLOSE FINISH',.85,[.846,.868,.821,.866,.795]],['FINISH',1,[.969,1,.952,.997,.928]]];
const dogs=[['Френк','#b37a49','#e6b97f','#634733','#da6844'],['Батон','#e9d9b8','#fff0d5','#b4a088','#ce9c38'],['Пельмень','#343b3e','#66716e','#232a30','#436e7b'],['Турбо','#788c9b','#c1ced1','#4c5a6b','#718549'],['Ракета','#a4a9ae','#e0ddd2','#505761','#8a6c89']];
const ground=[402,534,666,798,930];
$('crowd').innerHTML=repeat(10,i=>`<circle cx="${367+i*21}" cy="${208+i%2*4}" r="5" fill="#ddc79d"/><path d="M${362+i*21} ${219+i%2*4}q5-7 10 0v12h-10Z" fill="${['#c28061','#eee0bc','#597a79','#caad67'][i%4]}"/>`);
$('hills').innerHTML=repeat(3,i=>`<g transform="translate(${i*1100},0)"><path d="M-100 218Q100 67 300 178Q460 89 620 163Q790 65 1040 203L1150 269H-100Z" fill="#a0b9a2" opacity=".55"/><path d="M-100 228Q60 162 180 206Q310 136 490 211Q720 150 860 219Q1000 162 1150 233V280H-100Z" fill="#839f89" opacity=".57"/><path d="M120 42q45-19 70 0q60-16 89 3" fill="none" stroke="#f8f3de" stroke-width="9" opacity=".55" stroke-linecap="round"/></g>`);
$('middle').innerHTML=repeat(4,i=>`<g transform="translate(${i*960-250},0)"><use href="#tree" transform="translate(120,141) scale(.78)"/><use href="#tree" transform="translate(205,171) scale(.62)"/><use href="#tree" transform="translate(850,139) scale(.84)"/><use href="#tree" transform="translate(950,167) scale(.66)"/><use href="#pavilion"/><path d="M630 176Q710 205 805 178" stroke="#d7d1b1" fill="none"/>${repeat(7,j=>`<path d="M${637+j*24} ${182+Math.sin(j/6*Math.PI)*12}l9 21l9-17Z" fill="${j%2?'#e9d3a6':'#be7452'}"/>`)}</g>`);
$('rail').innerHTML=repeat(10,i=>`<g transform="translate(${i*320},0)"><path d="M20 225v58M185 225v58" stroke="#e4dbb9" stroke-width="7"/><rect x="65" y="236" width="104" height="34" rx="3" fill="${i%2?'#cfb68c':'#315a50'}"/><text x="117" y="258" text-anchor="middle" fill="${i%2?'#465e52':'#eae2c7'}" font-size="12" font-weight="800" letter-spacing="2">${i%2?'GOOD DOGS':'RACE CLUB'}</text></g>`)+ '<path d="M-40 233H3200M-40 260H3200" stroke="#e8dfc1" stroke-width="5"/>';
$('lanes').innerHTML=[428,560,692,824].map(y=>`<path d="M-30 ${y+1}Q500 ${y-1} 1050 ${y+1}T1970 ${y}" fill="none" stroke="#748c77" stroke-width="6" opacity=".27"/><path class="chalk" d="M-30 ${y}Q500 ${y-2} 1050 ${y}T1970 ${y-1}" fill="none" stroke="#eee7c9" opacity=".7" stroke-width="3" stroke-dasharray="170 5 35 3 240 4"/>`).join('');
$('boxes').innerHTML=ground.map((y,i)=>`<path d="M-210 ${y+20}h155v-100h-155" fill="none" stroke="#ecdfba" stroke-width="4" opacity=".8"/><text x="-257" y="${y-17}" fill="#eae6c8" font-size="62" font-weight="800" opacity=".8">${i+1}</text>`).join('');
$('front').innerHTML=repeat(8,i=>`<g transform="translate(${i*340},0)"><path d="M20 1035l28-8m4 0l70-5m36 9l90-8" stroke="#c9cd9c" stroke-width="3" opacity=".25"/><path d="M255 1024q-10-37-21-34q18 8 21 34q1-34 13-39q-6 18-9 39q16-19 24-13" fill="#83965a"/><rect x="18" y="994" width="14" height="71" rx="3" fill="#e4ddbd"/></g>`)+ '<path d="M-100 1011H2700" stroke="#264b44" stroke-width="13" opacity=".22"/><path d="M-100 1007H2700" stroke="#e2ddc1" stroke-width="12"/><path d="M-100 1003H2700" stroke="#ffefd0" stroke-width="3"/>';
dogs.forEach((d,i)=>$('defs').insertAdjacentHTML('beforeend',`<linearGradient id="coat${i}" x2=".4" y2="1"><stop stop-color="${d[2]}"/><stop offset=".6" stop-color="${d[1]}"/><stop offset="1" stop-color="${d[3]}"/></linearGradient>`));
$('racers').innerHTML=dogs.map((d,i)=>`<g id="r${i}" style="--body:url(#coat${i});--mask:${d[3]};--light:${d[2]};--accent:${d[4]}"><g id="v${i}"><ellipse class="shadow" cx="114" cy="127" rx="91" ry="12" fill="url(#shadow)"/><g class="dust" fill="#ede5c6"><ellipse cx="30" cy="120" rx="7" ry="3"/><circle cx="15" cy="117" r="3"/></g><use href="#dog"/></g><g id="label${i}"><circle cx="-46" cy="0" r="10" fill="${d[4]}"/><text x="-46" y="4" text-anchor="middle" fill="#fff3d8" font-size="12" font-weight="800">${i+1}</text><text x="-30" y="5" fill="#294a43" font-size="15" font-weight="800">${d[0]}</text></g></g>`).join('');
$('states').innerHTML=stages.map((s,i)=>`<button data-state="${i}" aria-pressed="${i===0}">${s[0]}</button>`).join('');
let position=0,playing=false,previous=0;
const move=(id,x)=>$(id).setAttribute('transform',`translate(${x},0)`);
function draw(){
 let k=stages.findIndex(s=>s[1]>=position),p;
 if(k<=0)p=stages[0][2];else{let a=stages[k-1],b=stages[k],t=(position-a[1])/(b[1]-a[1]);p=a[2].map((v,i)=>v+(b[2][i]-v)*t)}
 const mean=p.reduce((a,b)=>a+b,0)/5,camera=Math.max(0,Math.min(5320,430+mean*6400-860));
 move('hills',-(camera*.055%1100));move('middle',-(camera*.25%960));move('rail',-(camera*.65%640));move('front',-(camera*1.35%340));
 $('grain').setAttribute('patternTransform',`translate(${-camera},0)`);$('curb').setAttribute('patternTransform',`translate(${-camera},0)`);
 document.querySelectorAll('.chalk').forEach(e=>e.setAttribute('stroke-dashoffset',camera));
 move('start',430-camera);move('finish',6830-camera);
 p.forEach((v,i)=>{let w=208*(1+i*.018),h=w/210*103,x=430+v*6400-camera;move('r'+i,x);$('v'+i).setAttribute('transform',`translate(${-w},${ground[i]-h}) scale(${w/210},${h/130})`);$('label'+i).setAttribute('transform',`translate(${-w*.47},${ground[i]+14})`)});
 $('seek').value=Math.round(position*1000);
 document.querySelectorAll('[data-state]').forEach((b,i)=>b.setAttribute('aria-pressed',Math.abs(position-stages[i][1])<.001));
 $('scene').classList.toggle('moving',playing);$('play').textContent=playing?'Ⅱ':'▶';
}
function select(i){playing=false;position=stages[i][1];draw()}
function play(){if(position>=1)position=0;playing=!playing;previous=performance.now();draw()}
function hide(){let hidden=!$('controls').hidden;$('controls').hidden=hidden;$('show').hidden=!hidden}
document.querySelectorAll('[data-state]').forEach((b,i)=>b.onclick=()=>select(i));
$('play').onclick=play;$('hide').onclick=hide;$('show').onclick=hide;
$('seek').oninput=e=>{playing=false;position=Number(e.target.value)/1000;draw()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;if(/^[1-5]$/.test(e.key))select(Number(e.key)-1);if(e.code==='KeyH')hide();if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();play()}});
function tick(now){if(playing){if(!document.hidden)position=Math.min(1,position+Math.min(now-previous,80)/22000);if(position===1)playing=false;draw()}previous=now;requestAnimationFrame(tick)}
draw();requestAnimationFrame(tick);
</script>

 const fade=treatment==='soft'?c.feather:0;
 style(l.clip,'maskImage',fade?`linear-gradient(to right,transparent,#000 ${fade}px,#000 calc(100% - ${fade}px),transparent),linear-gradient(to bottom,transparent,#000 ${fade}px,#000 calc(100% - ${fade}px),transparent)`:'none');
 l.clip.style.maskComposite='intersect';l.fo.style.mixBlendMode=treatment==='multiply'?'multiply':'normal';
 attr(l.shadow,'cx',c.shadowX+c.xOffset);attr(l.shadow,'cy',ground[i]+c.yOffset+1);attr(l.shadow,'rx',c.shadowRadius*s/defaults[i+1].scale);
 $('label'+i).setAttribute('transform',`translate(${Math.max(66,(W-right-front)*s+c.xOffset+62)},${ground[i]-12})`);
}
function updateAll(){layers.forEach((_,i)=>updateLayer(i))}
const sceneDraw=draw;draw=function(){sceneDraw();updateAll()};draw();syncPanel();
// One lightweight scheduler for RUN section playback and presentation drift. No canvas/render loops.
setInterval(()=>{
 videos.forEach((v,i)=>{const c=cfg[i+1];if(v.readyState<2||v.seeking)return;if(!frozen&&(v.currentTime<c.runStart-.05||v.currentTime>=Math.min(c.runEnd,v.duration-.015))){v.currentTime=c.runStart;if(v.paused)resume(v)}if(c.frontTrack.length)updateLayer(i)});
 if(!panel.hidden){const v=videos[selected-1],q=v.getVideoPlaybackQuality?.();$('cal-status').textContent=`RUN ${v.currentTime.toFixed(2)} s · ${v.paused?'pause':'playing'}\nframes ${q?.totalVideoFrames??'—'} · dropped ${q?.droppedVideoFrames??'—'}\nФон непрозрачный: для финального качества нужен alpha.`}
},40);
window.realDogsDebug={videos,layers,updateAll,setPanel,get treatment(){return treatment},setTreatment(value){treatment=value;$('cal-treatment').value=value;updateAll()},get frozen(){return frozen}};
})();
