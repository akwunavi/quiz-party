# CI: типы + тесты + сборка на каждый пуш.
# Деплой (docs/) делается локально стандартной цепочкой, как в старом проекте —
# CI страхует: красный билд = в docs/ не выкладываем.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
