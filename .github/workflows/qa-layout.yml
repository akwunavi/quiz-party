name: qa-layout

on:
  pull_request:

jobs:
  layout:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright for QA only
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run layout regression scenarios
        run: npx playwright test e2e/visual/projector-player-layout.playwright.ts
      - name: Upload layout report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-layout-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
