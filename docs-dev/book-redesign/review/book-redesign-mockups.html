:root { --paper:#f8eedb; --paper2:#efe0c1; --paper3:#e4d1a9; --ink:#2a1f17; --ink2:#1f2a44; --muted:#6b4e33; --red:#8f1d2c; --red2:#b3263a; --red3:#5e101b; --gold:#c9a14a; --gold2:#f2d58c; --gold3:#8a6a24; --pine:#24442f; --ok:#2f6b3f; --bad:#a3261f;
  --silver:#c3cad2; --silver2:#7f8a96; --bronze:#c58046; --bronze2:#7d4a22; --shade:#d9c59c; --shadow:rgba(60,35,12,.28); --line:rgba(138,106,36,.55);
  --q-font:'PT Serif',Georgia,serif; --h-font:'Cormorant Garamond','PT Serif',Georgia,serif; --n-font:'EB Garamond','PT Serif',Georgia,serif; }
.dirB { --q-font:'Lora',Georgia,serif; --h-font:'Philosopher','Lora',Georgia,serif; --n-font:'Lora',Georgia,serif; }
* { box-sizing:border-box } html,body { margin:0; background:#15100d; color:#e9dcc2; font:14px/1.4 system-ui,sans-serif }
#bar { position:sticky; top:0; z-index:50; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; background:#211813; border-bottom:1px solid #4a3a28 }
#bar button { background:#2d2219; color:#e9dcc2; border:1px solid #5a4630; border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit }
#bar button.on { background:#c9a14a; color:#2a1f17; border-color:#c9a14a }
#bar .sep { width:1px; height:22px; background:#4a3a28; margin:0 4px } #bar label { display:flex; gap:4px; align-items:center; color:#bba98a }
#note { padding:8px 14px; color:#d9b36a; background:#2a1d10; border-bottom:1px solid #4a3a28; font-size:13px }
#main { padding:14px; display:flex; flex-direction:column; gap:18px }
.sec h2 { margin:6px 0 4px; font:700 18px system-ui; color:#f2d58c } .sec p.d { margin:0 0 8px; color:#bba98a; font-size:13px; max-width:1100px }
.row { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start } .cap { font-size:12px; color:#bba98a; margin:3px 2px }
/* кадр: сцена 1920×1080 вписана «contain» в выбранное разрешение */
.frame { position:relative; background:#0c0807; overflow:hidden; border:1px solid #4a3a28; border-radius:4px; cursor:zoom-in }
.stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:0 0; font-family:var(--q-font); color:var(--ink) }
#zoom { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center } #zoom.on { display:flex } #zoom .frame { cursor:zoom-out }
/* книжный разворот */
.desk { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 40%, #4a2f1d, #1a0f0a 75%) }
.book { position:absolute; left:64px; top:50px; width:1792px; height:990px; border-radius:10px; background:linear-gradient(90deg,#5e101b,#7a1a28 2%,#5e101b 100%); box-shadow:0 30px 60px rgba(0,0,0,.6) }
.pages { position:absolute; left:30px; top:24px; right:30px; bottom:24px; display:flex; background:var(--paper2); border-radius:4px; overflow:hidden }
.pg { flex:1; position:relative; background:radial-gradient(ellipse at 50% 40%, #fbf3e1, #f1e2c3 80%, #e4d1a9) }
.pg.l { box-shadow:inset -90px 0 80px -60px rgba(90,55,20,.42) } .pg.r { box-shadow:inset 90px 0 80px -60px rgba(90,55,20,.42) }
.fold { position:absolute; left:50%; top:0; bottom:0; width:6px; margin-left:-3px; background:linear-gradient(90deg,rgba(60,35,12,.25),rgba(255,255,255,.2),rgba(60,35,12,.25)) }
.garl { position:absolute; left:50%; top:-14px; width:1060px; margin-left:-530px; pointer-events:none } .sprig { position:absolute; bottom:6px; width:230px; pointer-events:none }
.content { position:absolute; inset:0 } .abs { position:absolute }
/* типографика */
.chap { font:700 84px/1.02 var(--h-font); color:var(--ink2); letter-spacing:.01em; text-shadow:0 3px 0 rgba(201,161,74,.45) }
.round-tag { font:700 26px var(--q-font); letter-spacing:.3em; color:var(--red); text-transform:uppercase }
.q { font:700 62px/1.16 var(--q-font); color:var(--ink); text-align:center; text-wrap:balance } .q.long { font-size:40px } .q.short { font-size:84px }
.choice { display:flex; align-items:center; gap:18px; font:700 32px/1.2 var(--q-font); color:var(--ink) }
.key { flex:none; width:50px; height:50px; border-radius:50%; display:grid; place-items:center; font:700 28px var(--q-font); color:var(--paper); background:var(--red); box-shadow:inset 0 0 0 3px rgba(242,213,140,.55) }
.ans { font:700 60px/1.1 var(--h-font); color:var(--ok) } .note { font:italic 400 30px/1.35 var(--q-font); color:var(--muted) }
.tname { font:600 34px/1.1 var(--n-font); color:var(--ink) } .rule { font:400 34px/1.35 var(--q-font); color:var(--ink) } .svc { font:700 20px var(--q-font); letter-spacing:.22em; text-transform:uppercase; color:var(--muted) }
/* таймер */
.tm { position:relative; flex:none; aspect-ratio:1010/990 } .tm img { position:absolute; inset:0; width:100%; height:100%; display:block }
.tm .arc { position:absolute; left:23.5%; top:24%; width:53%; height:53%; border-radius:50%; background:conic-gradient(var(--red) calc(var(--f)*360deg), transparent 0); -webkit-mask:radial-gradient(circle, transparent 60%, #000 61%); mask:radial-gradient(circle, transparent 60%, #000 61%); opacity:.85 }
.tm .num { position:absolute; left:23.5%; top:24%; width:53%; height:53%; display:grid; place-items:center; font:700 calc(var(--d)*.30)/1 var(--q-font); color:var(--red3); letter-spacing:-.02em }
.tm.low .num { color:var(--bad) }
/* плашки номера */
.qn-a { display:inline-flex; align-items:center; gap:14px; padding:10px 26px 10px 22px; font:700 24px/1 var(--q-font); letter-spacing:.14em; color:var(--gold2); text-transform:uppercase; background:linear-gradient(180deg,#8f1d2c,#5e101b); border-radius:4px; box-shadow:inset 0 0 0 2px rgba(242,213,140,.55), inset 0 0 0 5px #6e1522, inset 0 0 0 6px rgba(242,213,140,.3), 0 4px 0 #3b0a11, 0 8px 12px rgba(60,35,12,.35); text-shadow:0 1px 0 #3b0a11, 0 -1px 0 rgba(255,235,180,.4) }
.qn-a b { font-size:34px; color:#fff3cf } .qn-a i { font-style:normal; opacity:.75 }
.qn-b { position:relative; display:inline-block; padding:16px 26px 40px; font:700 22px/1.1 var(--q-font); letter-spacing:.12em; color:var(--gold2); text-align:center; text-transform:uppercase; background:linear-gradient(180deg,#a8283b,#7a1522 85%); clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 20px),0 100%); filter:drop-shadow(0 6px 4px rgba(60,35,12,.4)) }
.qn-b b { display:block; font:700 44px/1 var(--h-font); color:#fff3cf; margin:2px 0 } .qn-b small { display:block; opacity:.8; font-size:18px; letter-spacing:.2em }
.qn-b::before { content:''; position:absolute; inset:6px 6px 26px; border:2px solid rgba(242,213,140,.55); pointer-events:none }
/* карточки команд */
.tc { position:relative; font-family:var(--n-font); color:var(--ink); display:flex; align-items:center; gap:.5em; min-width:0 }
.tc .nm { min-width:0; overflow-wrap:break-word; line-height:1.08; font-weight:600 } .tc .sc { margin-left:auto; font:700 1em var(--q-font); color:var(--red) }
.tc .dot { flex:none; width:.9em; height:.9em; border-radius:50%; background:var(--c); box-shadow:inset 0 0 0 .1em rgba(255,255,255,.6), 0 0 0 .08em var(--gold3) }
.tcA { padding:.45em .8em; background:linear-gradient(180deg,#fbf1da,#ecdcb8); border-radius:.35em; box-shadow:inset 0 0 0 .07em var(--gold), inset 0 0 0 .2em #f6e8c8, inset 0 0 0 .24em rgba(201,161,74,.7), 0 .12em .25em var(--shadow) }
.tcB { padding:.45em .8em .45em 1.5em; background:linear-gradient(180deg,#f7ead0,#e8d6ae); clip-path:polygon(0 0,100% 0,calc(100% - .7em) 50%,100% 100%,0 100%); padding-right:1.4em }
.tcB::before { content:''; position:absolute; left:0; top:0; bottom:0; width:.45em; background:var(--c) }
.tcC { padding:.5em .85em; background:linear-gradient(180deg,#8f1d2c,#6e1522); color:var(--gold2); border-radius:.3em; box-shadow:inset 0 0 0 .06em rgba(242,213,140,.7), inset 0 0 0 .2em #7a1a28, inset 0 0 0 .24em rgba(242,213,140,.35), 0 .14em 0 #3b0a11 }
.tcC .nm { color:#fff3cf; text-shadow:0 .04em 0 #3b0a11 } .tcC .sc { color:var(--gold2) } .tcC .dot { box-shadow:inset 0 0 0 .1em rgba(255,255,255,.7) }
.tc.empty { opacity:.55; filter:grayscale(.4) } .tc.ok { outline:.12em solid var(--ok); outline-offset:.12em } .tc.bad { outline:.12em solid var(--bad); outline-offset:.12em } .tc.sel { transform:scale(1.04); filter:drop-shadow(0 0 .4em rgba(242,213,140,.9)) }
.tc .mk { flex:none; font:700 .9em var(--q-font) } .tc.ok .mk { color:var(--ok) } .tc.bad .mk { color:var(--bad) }
.tcC.ok .mk { color:#bff0c8 } .tcC.bad .mk { color:#ffb8b0 }
/* единое оформление */
.btn { display:inline-block; padding:14px 34px; font:700 28px var(--q-font); color:var(--paper); background:linear-gradient(180deg,var(--red2),var(--red3)); border-radius:6px; box-shadow:inset 0 0 0 2px rgba(242,213,140,.6), 0 5px 0 #3b0a11, 0 10px 14px rgba(60,35,12,.35) }
.btn.ghost { background:linear-gradient(180deg,#f6e8c8,#e4d1a9); color:var(--ink); box-shadow:inset 0 0 0 2px var(--gold), 0 5px 0 var(--shade), 0 10px 14px rgba(60,35,12,.25) }
.pframe { background:#fffdf6; padding:10px; box-shadow:0 0 0 2px var(--line), 0 10px 18px rgba(60,35,12,.3) } .ph { background:linear-gradient(135deg,#2e5eaa,#c44834); display:block }
.tile { padding:10px 16px; font:700 26px var(--q-font); text-align:center; background:linear-gradient(180deg,#fbf1da,#ecdcb8); border-radius:6px; box-shadow:inset 0 0 0 2px var(--gold), 0 4px 0 var(--shade) } .tile.used { opacity:.38 } .tile.sel { background:linear-gradient(180deg,#f2d58c,#c9a14a); box-shadow:inset 0 0 0 2px var(--gold3), 0 0 14px rgba(242,213,140,.9) }
.correct { padding:14px 28px; background:linear-gradient(180deg,#f2d58c,#d9b45e); border-radius:6px; box-shadow:inset 0 0 0 2px var(--gold3), 0 5px 0 #a87e24; font:700 40px var(--h-font); color:var(--ink) }
.tbl { border-collapse:collapse; font:600 30px var(--n-font); color:var(--ink) } .tbl th { font:700 20px var(--q-font); letter-spacing:.2em; color:var(--red); text-align:left; padding:6px 16px; border-bottom:3px double var(--gold3) } .tbl td { padding:7px 16px; border-bottom:1px solid var(--line) } .tbl td.n { text-align:right; font-family:var(--q-font); color:var(--red) }
.chapbar { display:flex; align-items:center; gap:22px; font:700 26px var(--q-font); letter-spacing:.3em; color:var(--red); text-transform:uppercase } .chapbar::before,.chapbar::after { content:''; flex:1; height:3px; background:linear-gradient(90deg,transparent,var(--gold),transparent) }
/* мелодия */
.cov { position:absolute; background-size:100% 100%; filter:drop-shadow(0 14px 18px rgba(0,0,0,.5)) } .cov .ttl,.cov .tl { position:absolute; display:grid; place-items:center; text-align:center; color:var(--ink); font:700 var(--fs,26px)/1.1 var(--q-font); padding:4px } .cov .ttl { font-family:var(--h-font); font-size:40px }
.cov .tl.used { filter:grayscale(.8) brightness(.8); opacity:.7; text-decoration:line-through } .cov .tl.sel { box-shadow:0 0 0 4px var(--red), 0 0 18px rgba(179,38,58,.7); background:rgba(242,213,140,.5) } .cov .tl small { display:block; font:400 18px var(--q-font); color:var(--muted) }
.modal { position:absolute; left:360px; top:90px; width:1200px; height:880px; background:linear-gradient(180deg,#fbf1da,#ecdcb8); border-radius:16px; box-shadow:inset 0 0 0 4px var(--gold), inset 0 0 0 10px #f6e8c8, inset 0 0 0 12px rgba(201,161,74,.7), 0 30px 60px rgba(0,0,0,.55) }
.spin .rec { animation:rot 1.8s linear infinite } @keyframes rot { to { transform:rotate(360deg) } } @media (prefers-reduced-motion:reduce) { .spin .rec { animation:none } }
/* финал */
.medal { display:grid; place-items:center; border-radius:50%; font:700 var(--s)/1 var(--q-font); width:2em; height:2em; font-size:var(--m,30px); color:#2a1f17 }
.medal.g { background:radial-gradient(circle at 35% 30%,#fff1b8,#e0b13e 55%,#9a6f17); box-shadow:inset 0 0 0 .08em #fff1b8,0 .1em .3em rgba(0,0,0,.4) } .medal.s { background:radial-gradient(circle at 35% 30%,#fff,#c3cad2 55%,#7f8a96); box-shadow:inset 0 0 0 .08em #fff,0 .1em .3em rgba(0,0,0,.4) } .medal.b { background:radial-gradient(circle at 35% 30%,#f6c697,#c58046 55%,#7d4a22); box-shadow:inset 0 0 0 .08em #f6c697,0 .1em .3em rgba(0,0,0,.4) }
/* анимации */
@keyframes tw { 0%,100% { opacity:.35 } 50% { opacity:1 } } .garl.tw { animation:tw 2.4s ease-in-out infinite }
.pgturn { position:absolute; left:50%; top:24px; bottom:24px; width:50%; margin-left:-30px; transform-origin:0 50%; background:linear-gradient(90deg,#e4d1a9,#fbf3e1 40%,#efe0c1); box-shadow:-20px 0 40px rgba(60,35,12,.35); z-index:30; backface-visibility:hidden; transform:rotateY(0) }
.pgturn.go { animation:flip .9s cubic-bezier(.5,0,.3,1) forwards } @keyframes flip { 0% { transform:rotateY(0) } 100% { transform:rotateY(-179deg); opacity:.2 } }
.chapopen.go { animation:chap 1.4s ease-out forwards } @keyframes chap { 0% { clip-path:inset(0 50% 0 50%); filter:brightness(1.6) } 100% { clip-path:inset(0 0 0 0); filter:none } }
.stamp.go { animation:stamp .7s cubic-bezier(.2,1.4,.4,1) forwards } @keyframes stamp { 0% { transform:scale(2.6) rotate(-14deg); opacity:0 } 60% { opacity:1 } 100% { transform:scale(1) rotate(-6deg); opacity:1 } }
.pop.go > * { animation:pop .5s cubic-bezier(.2,1.3,.4,1) both; animation-delay:calc(var(--i)*70ms) } @keyframes pop { 0% { transform:translateY(30px) scale(.8); opacity:0 } 100% { transform:none; opacity:1 } }
.tile.go { animation:tsel .5s ease-out forwards } @keyframes tsel { 0% { transform:scale(1) } 40% { transform:scale(1.12) } 100% { transform:scale(1.04) } }
.tofin.go { animation:fin 1.6s ease-in-out forwards } @keyframes fin { 0% { opacity:0; transform:scale(1.15) } 100% { opacity:1; transform:none } }
body.reduce .garl.tw,body.reduce .spin .rec { animation:none !important }
body.reduce .pgturn.go,body.reduce .chapopen.go,body.reduce .stamp.go,body.reduce .pop.go > *,body.reduce .tile.go,body.reduce .tofin.go { animation:rdfade .25s ease-out both !important } @keyframes rdfade { from { opacity:0 } to { opacity:1 } }

/* перелистывание: вариант 1 «лист на корешке» (3D-поворот, свет и тень по углу), вариант 2 «загиб угла» (лист сворачивается по диагонали) */
.pg-wrap { position:absolute; left:50%; top:24px; bottom:24px; width:50%; perspective:2600px; z-index:30; pointer-events:none }
.leaf1 { position:absolute; inset:0; transform-origin:0 50%; transform-style:preserve-3d; background:linear-gradient(90deg,#e8d6ac,#f6ecd2 18%,#f1e2c3 80%,#e2cd9f); box-shadow:inset 40px 0 50px -30px rgba(90,55,20,.5); animation:leaf1 1.15s cubic-bezier(.45,.05,.3,1) forwards }
.leaf1::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,rgba(40,20,5,.0),rgba(40,20,5,.45)); animation:shade1 1.15s ease-in-out forwards }
@keyframes leaf1 { 0% { transform:rotateY(0) } 100% { transform:rotateY(-180deg) } }
@keyframes shade1 { 0%,100% { opacity:0 } 45% { opacity:1 } }
.leaf2 { position:absolute; inset:0; background:linear-gradient(135deg,#f6ecd2,#ead8ab); filter:drop-shadow(-18px 10px 18px rgba(60,35,12,.45)); animation:leaf2 1.2s cubic-bezier(.5,0,.3,1) forwards }
@keyframes leaf2 { 0% { clip-path:polygon(0 0,100% 0,100% 100%,0 100%) } 60% { clip-path:polygon(0 0,100% 0,28% 100%,0 100%) } 100% { clip-path:polygon(0 0,0 0,0 100%,0 100%) } }
.leaf2::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,0) 60%,rgba(255,255,255,.55) 80%,rgba(120,80,30,.3)); }
body.reduce .leaf1,body.reduce .leaf2,body.reduce .leaf1::after { animation:rdfade .25s ease-out both !important }
.rowdrop > * { animation:rowd .85s cubic-bezier(.2,.8,.25,1) both; animation-delay:calc(var(--i)*600ms) } @keyframes rowd { 0% { opacity:0; transform:translateY(-70px) } 55% { opacity:1 } 100% { opacity:1; transform:none } }
body.reduce .rowdrop > * { animation:rdfade .25s ease-out both !important }
</style></head>

function cards(n, kind, st, o = {}) {
  const ns = names(n), fs = n <= 4 ? 46 : n <= 8 ? 36 : 27, cols = n <= 8 ? 1 : 2, w = o.w ?? 700
  const items = ns.map((nm, i) => {
    let cls = '', mk = '', sc = ''
    if (st === 'answers') { if (i % 3 === 0) { cls = 'ok'; mk = '✓' } else if (i % 3 === 1) { cls = 'bad'; mk = '✗' } else if (i % 5 === 2) cls = 'empty' }
    if (st === 'sel' && i === 1) cls = 'sel'
    if (st === 'final') sc = (20 - i * 1.5).toFixed(1).replace('.0', '')
    return `<div class="tc tc${kind} ${cls}" style="--c:${COLORS[i]}"><span class="dot"></span><span class="nm">${esc(nm)}</span>${mk ? `<span class="mk">${mk}</span>` : ''}${sc ? `<span class="sc">${sc}</span>` : ''}</div>`
  }).join('')
  if (n === 0) return `<div style="text-align:center;width:${w}px"><div class="chap" style="font-size:56px">Ждём команды</div><p class="note" style="margin:12px 0 0">Наведите камеру на код слева — и выберите название</p></div>`
  return `<div style="width:${w}px;font-size:${fs}px;display:grid;grid-template-columns:repeat(${cols},1fr);gap:.4em .5em">${items}</div>`
}
