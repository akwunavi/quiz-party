<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Race V3 · Фрэнк + №4 · лаборатория</title>
<style>body{margin:0;background:#1d2b2a;color:#f7f2de;font:16px system-ui,sans-serif}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px}button,select,input{font:inherit}button,select{background:#f1dfaf;border:0;border-radius:6px;padding:8px 13px;color:#213335;cursor:pointer}input[type=range]{width:min(360px,36vw)}#status{margin-left:auto;color:#d2e8d5}#diag{color:#ff8a7e;padding:0 18px}canvas{display:block;width:100%;height:auto;max-width:1920px;margin:auto;background:#bbd6cb}details{max-width:1250px;margin:18px auto;padding:0 18px 24px}table{border-collapse:collapse;width:100%}td,th{padding:5px 8px;border-bottom:1px solid #526360;text-align:left}</style>
</head><body><header>
<label>Сценарий <select id="preset"><option value="PAIR">№4 ↔ Фрэнк · NORMAL (SNIFF, BUTTERFLY, ROLL)</option><option value="ALL_EVENTS">Фрэнк · SNIFF → BUTTERFLY → ROLL · 5 категорий</option><option value="ROLL_ALL">Фрэнк · ROLL · 5 категорий</option><option value="CHAIN_ALL">Фрэнк · SNIFF · 5 категорий</option><option value="BUTTERFLY_ALL">Фрэнк · BUTTERFLY · 5 категорий</option><option value="RANDOM">RANDOM · seed (№4 как в dog4-v3-lab)</option></select></label>
<label>Seed <input id="seed" type="number" min="0" max="4294967295" step="1" value="20261013" style="width:125px"></label>
<label>Фрэнк на дорожке <select id="frenklane"><option value="-1">нет</option><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option><option value="4">5</option></select></label>
<button id="generate">Создать</button><button id="play">▶ Play</button><button id="reset">Сброс</button>
<label>Скорость <select id="speed"><option value="1">1×</option><option value="0.25">0,25×</option><option value="2">2×</option></select></label>
<input id="scrub" type="range" min="0" max="1000" value="0"><span id="clock">0:00.00</span><span id="status">Загрузка…</span></header>
<div id="diag"></div>
<canvas id="race" width="1920" height="1080" aria-label="Фрэнк и бульдог номер четыре"></canvas>
<details><summary>Параметры и результаты</summary><table id="table"></table></details>
<script type="module" src="./app.mjs"></script></body></html>
