<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Снежный кубок — участок арены</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0d1829;color:#edf5f4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% -20%,#27445a,#0b1423 70%)}
    .shell{width:min(100vw,1920px);padding:16px 20px 20px}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 11px}
    .brand{display:flex;align-items:baseline;gap:14px}h1{font-family:Georgia,serif;font-size:clamp(23px,2.2vw,36px);letter-spacing:.02em;margin:0;color:#f8e4b5}.tag{font-size:13px;letter-spacing:.15em;color:#add2dd;text-transform:uppercase}
    .controls{display:flex;align-items:center;gap:11px;flex-wrap:wrap}button{background:#b96a58;border:1px solid #f2b18d;border-radius:8px;color:white;font-family:inherit;font-size:15px;font-weight:700;padding:9px 20px;cursor:pointer}button:hover{background:#cd7c63}
    label{font-size:13px;color:#d5e4e8;display:flex;align-items:center;gap:6px}input[type=range]{width:150px;accent-color:#eabf85}input[type=checkbox]{accent-color:#eabf85}
    #stage{display:block;width:100%;aspect-ratio:16/9;background:#17273e;border:1px solid #4f6b78;border-radius:5px;box-shadow:0 20px 65px #020813aa}
    footer{display:flex;justify-content:space-between;gap:12px;margin-top:9px;font-size:12px;color:#a9c3c8}.hint{opacity:.85}
    @media(max-width:800px){header{align-items:flex-start;flex-direction:column}.shell{padding:10px}.tag{font-size:10px}}
  </style>
  <script type="module" crossorigin src="./assets/index-Ce3VW4wG.js"></script>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><h1>Снежный кубок</h1><span class="tag">участок арены · B × C</span></div>
      <div class="controls">
        <button id="play" type="button">Запустить камеру</button>
        <label>Позиция <input id="timeline" type="range" min="0" max="18" step="0.01" value="0"></label>
        <label><input id="markers" type="checkbox"> Габариты участников</label>
      </div>
    </header>
    <canvas id="stage" aria-label="Интерактивная зимняя арена"></canvas>
    <footer><span class="hint">Отдельная лаборатория сцены · без собак и без Race V3</span><span id="status">0,0 / 18,0 с</span></footer>
  </div>
</body>
</html>
